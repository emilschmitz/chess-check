[project]
name = "chess-check"
version = "0.1.0"
description = "Testing Epoch AI's hypothesis: Does training loss correlate with chess prediction performance?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "python-chess>=1.999",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.3",
]

